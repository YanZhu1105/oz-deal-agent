name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Redact personal data, credentials, and private feedback.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version and Codex environment
